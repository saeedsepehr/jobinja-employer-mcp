[project]
name = "jobinja-mcp"
version = "0.1.0"
description = "MCP server for the Jobinja employer panel: job ads, applicants, resumes, stars, notes, folders and rejections."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "jobinja", "recruiting", "ats", "claude", "chatgpt", "playwright"]
dependencies = ["mcp[cli]>=1.25,<2", "playwright>=1.45", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/saeedsepehr/jobinja-mcp"
Issues = "https://github.com/saeedsepehr/jobinja-mcp/issues"

[project.scripts]
jobinja-mcp = "jobinja_mcp:main"

[tool.setuptools]
py-modules = ["jobinja_mcp"]
