[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobinja-employer-mcp"
version = "0.3.1"
description = "مرور سریع و شورت‌لیست رزومه‌های دریافتی پنل کارفرمایی جابینجا با هوش مصنوعی و مصرف توکن کم — MCP server for Jobinja employers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "jobinja", "resume-screening", "shortlisting", "employer", "recruitment-automation", "hr", "ats", "claude", "chatgpt", "persian", "جابینجا", "رزومه", "استخدام"]
dependencies = ["mcp[cli]>=1.25,<2", "playwright>=1.45", "uvicorn>=0.30", "pypdf>=4"]

[project.urls]
Homepage = "https://github.com/saeedsepehr/jobinja-employer-mcp"
Issues = "https://github.com/saeedsepehr/jobinja-employer-mcp/issues"

[project.scripts]
jobinja-employer-mcp = "jobinja_mcp:main"
jobinja-mcp = "jobinja_mcp:main"

[tool.setuptools]
py-modules = ["jobinja_mcp"]
